name: Go Test Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage:
    name: Go Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # B8 (2026-09-11): branding/scope_test.go diffs every .go file
          # against base 954f11b1 to prove no import target was renamed; on a
          # depth-1 checkout that sha is absent and `git diff` exits 128.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/scripts/requirements.txt

      # setup-go already restores the module/build caches. A second module-cache
      # restore collided with those files and stalled before the tests (PR #116).
      - name: Download dependencies
        run: go mod download

      - name: Verify Go coverage tool
        run: |
          go tool cover -h || echo "Warning: go tool cover not available"

      - name: Run tests with coverage
        env:
          DATA_ENCRYPTION_KEY: "test-encryption-key-for-ci-only-not-production"
        # m471: -count=1 so no result is read from the GOCACHE setup-go restored
        # (this is the UTC leg of Q5; PR #625 read 20 packages from cache).
        # m474: -timeout 330m (was 200m). After m473 (#628) kernel/mentor alone
        # needs ~12,000 s under -race (the restart/seed replays got 1.4-2.6x
        # slower with the carried-box rebuild); dev run 42571486526 and PR #629
        # run 42622262431 both died at the 200m cap with every test passing so
        # far. The job's own limit is 360 min. Follow-up: speed up the seed
        # replays so this can come back down.
        run: |
          go test -v -count=1 -race -timeout 330m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Calculate coverage and generate report
        id: coverage
        run: |
          chmod +x .github/workflows/scripts/calculate_coverage.py
          python .github/workflows/scripts/calculate_coverage.py coverage.out coverage_report.md

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/workflows/scripts/comment_pr.py
          python .github/workflows/scripts/comment_pr.py \
            ${{ github.event.pull_request.number }} \
            "${{ steps.coverage.outputs.coverage }}" \
            "${{ steps.coverage.outputs.emoji }}" \
            "${{ steps.coverage.outputs.status }}" \
            "${{ steps.coverage.outputs.badge_color }}" \
            coverage_report.md
